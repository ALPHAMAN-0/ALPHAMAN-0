<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 148" width="420" height="148" role="img" aria-label="Sir_ar_last_date — Class-deadline checker: upload a roster, set a deadline, see who pushed on time.">
<style>
text{font-family:'SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',Menlo,monospace}
.in{animation:in .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:0.45s}
@keyframes in{from{opacity:0;transform:translateY(7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="in">
<rect x="0.5" y="0.5" width="419" height="147" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<line x1="0" y1="42" x2="420" y2="42" stroke="#d0d7de"/>
<text x="20" y="27" font-size="13" fill="#57606a" textLength="7.8" lengthAdjust="spacingAndGlyphs">❯</text>
<text x="35.6" y="27" font-size="13" fill="#1f2328" textLength="124.8" lengthAdjust="spacingAndGlyphs">Sir_ar_last_date</text>
<text x="20" y="70" font-size="10.5" fill="#57606a" textLength="252" lengthAdjust="spacingAndGlyphs">Class-deadline checker: upload a roster,</text>
<text x="20" y="88" font-size="10.5" fill="#57606a" textLength="245.7" lengthAdjust="spacingAndGlyphs">set a deadline, see who pushed on time.</text>
<g><rect x="20" y="112" width="73" height="19" rx="5" fill="none" stroke="#d0d7de"/><text x="28" y="125" font-size="9.5" fill="#57606a" textLength="57" lengthAdjust="spacingAndGlyphs">cloudflare</text></g><g><rect x="100" y="112" width="39" height="19" rx="5" fill="none" stroke="#d0d7de"/><text x="108" y="125" font-size="9.5" fill="#57606a" textLength="22.8" lengthAdjust="spacingAndGlyphs">edge</text></g><g><rect x="146" y="112" width="73" height="19" rx="5" fill="none" stroke="#d0d7de"/><text x="154" y="125" font-size="9.5" fill="#57606a" textLength="57" lengthAdjust="spacingAndGlyphs">typescript</text></g>
</g>
</svg>
