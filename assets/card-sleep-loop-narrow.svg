<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 304" width="430" height="304" role="img" aria-label="Sleep Loop: A Python repair loop of about 200 lines: a scripted maker proposes fixes, a checker runs ast, lint and pytest, and failures become rules. How it works: a maker proposes a fix, a pytest checker gates it, a failure is written to RULES.md and goes back to the maker, a pass waits for a human to merge.">
