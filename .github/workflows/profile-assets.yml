name: Generate profile assets

# Builds every image the profile README depends on and pushes them to the
# `output` branch, so the README never fetches an image from a third-party host
# at render time. If a run fails, the previous assets stay on the branch and the
# profile keeps rendering the last good version.
#
# Snake and stats share one job on purpose: the publish step force-pushes the
# whole `dist/` directory, so two workflows writing to the same branch would
# overwrite each other's output.

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # assets/ is generated by render-static.mjs and committed to main. Re-run
      # the generator here so a hand-edited SVG can never silently drift away
      # from the script that is supposed to produce it. Runs before the slow
      # steps so it fails fast.
      - name: Verify committed assets match their generator
        run: |
          node .github/scripts/render-static.mjs
          git diff --exit-code assets/

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ALPHAMAN-0
          outputs: |
            dist/snake.svg?color_snake=#ffffff&color_dots=#161b22,#30363d,#8b949e,#c9d1d9,#ffffff
            dist/snake-light.svg?color_snake=#1f2328&color_dots=#ebedf0,#d0d7de,#8c959f,#57606a,#1f2328

      - name: Render stats card
        env:
          # The default GITHUB_TOKEN can read public contribution data. Set a
          # STATS_TOKEN secret only if this step ever starts returning 401.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_USER: ALPHAMAN-0
        run: node .github/scripts/render-stats.mjs

      - name: Push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
