name: Generate profile assets

# Two independent jobs.
#
# verify: re-runs the static generator and fails if assets/ or README.md would
# change, or if an image the README shows is not committed, so a hand-edited
# SVG or README block can never silently drift from the script that writes it.
#
# generate: builds the images that need live data (the stats card and the
# snake) and pushes them to the `output` branch, so the README never fetches an
# image from a third-party host at render time. If a run fails, the previous
# images stay on the branch and the profile keeps rendering the last good
# version. It does not wait for verify: a drift in assets/ must not freeze the
# stats. Snake and stats share this job on purpose: the publish step
# force-pushes the whole `dist/` directory, so two jobs writing to the same
# branch would overwrite each other's output.

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # git status, not git diff: a generated file that was never committed
      # shows up as untracked, which git diff would not report.
      - name: Verify committed assets and README match their generator
        run: |
          node .github/scripts/render-static.mjs
          if [ -n "$(git status --porcelain -- assets/ README.md)" ]; then
            git status --porcelain -- assets/ README.md
            echo "::error::assets/ or README.md differ from render-static.mjs output. Run it locally and commit the result."
            exit 1
          fi
          grep -oE 'assets/[A-Za-z0-9._-]+\.svg' README.md | sort -u | xargs git ls-files --error-unmatch > /dev/null

  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ALPHAMAN-0
          outputs: |
            dist/snake.svg?color_snake=#5ab9fc&color_dots=#161b22,#173d63,#1d4f7c,#2f86c8,#5ab9fc
            dist/snake-light.svg?color_snake=#1a4be0&color_dots=#ebedf0,#bfd0f8,#97b2f2,#5a82ea,#1a4be0

      - name: Render stats card
        env:
          # The default GITHUB_TOKEN can read public contribution data. Set a
          # STATS_TOKEN secret only if this step ever starts returning 401.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_USER: ALPHAMAN-0
        run: node .github/scripts/render-stats.mjs

      - name: Push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
